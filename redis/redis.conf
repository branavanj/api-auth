# Le mot de passe est passé en ligne de commande (--requirepass) depuis le .env.
bind 0.0.0.0
protected-mode yes
port 6379

# Sessions, challenges 2FA et compteurs de rate limiting ne doivent jamais
# être évincés en silence : en cas de mémoire pleine, Redis refuse l'écriture.
maxmemory 256mb
maxmemory-policy noeviction

# Persistance : AOF (au plus 1 s de perte) + snapshots.
appendonly yes
appendfsync everysec
save 900 1
save 300 10

# Commandes destructrices désactivées.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

loglevel notice
